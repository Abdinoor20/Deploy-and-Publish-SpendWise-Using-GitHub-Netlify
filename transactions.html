<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transactions | SpendWise</title>
  <meta name="description" content="Search, filter, export and manage all your SpendWise transactions.">
  <meta name="theme-color" content="#10292E">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34">SpendWise</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Dashboard</a>
        <a href="transactions.html" aria-current="page">Transactions</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <h1>Transactions</h1>
    <p class="lead">Search and filter everything you have recorded.</p>

    <div class="filters">
      <div class="field search"><label for="f-search">Search</label><input id="f-search" type="search" placeholder="Note or category"></div>
      <div class="field"><label for="f-type">Type</label><select id="f-type"><option value="">All types</option><option value="income">Income</option><option value="expense">Expense</option></select></div>
      <div class="field"><label for="f-cat">Category</label><select id="f-cat"></select></div>
      <div class="field"><label for="f-month">Month</label><select id="f-month"></select></div>
    </div>

    <section class="card flat">
      <div class="table-wrap" id="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Note</th><th>Category</th><th class="r">Amount</th><th class="r"><span class="sr">Action</span></th></tr></thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <div class="toolbar">
      <span class="totals" id="totals" role="status" aria-live="polite"></span>
      <span style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" id="export-btn" type="button">Export CSV</button>
        <button class="btn danger" id="clear-btn" type="button">Delete all</button>
      </span>
    </div>
  </main>
  <footer class="site-footer">SpendWise v1.0 · Your data stays in this browser · <a href="about.html">About</a></footer>
  <script src="js/app.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
